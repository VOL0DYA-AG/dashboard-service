server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  location = / {
    return 302 /cabinet/;
  }

  location = /cabinet/config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /cabinet/ {
    try_files $uri $uri/ /cabinet/index.html;
  }
}
