server {
  listen 80;
  server_name _;
  # Внутри контейнера nginx слушает 80, снаружи это порт 8090.
  # Абсолютный редирект выкидывал порт и вёл на http://195.170.163.72/cabinet/,
  # а там отвечает чужой прокси с ошибкой 502. Относительный адрес оставляет :8090.
  absolute_redirect off;
  port_in_redirect off;

  root /usr/share/nginx/html;

  location = / {
    return 302 /cabinet/;
  }

  location = /cabinet/config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /cabinet/ {
    try_files $uri $uri/ /cabinet/index.html;
  }
}
