# Стек OpenRemote и личный кабинет котельной.
# Кабинет — статические файлы, Manager отдаёт их по адресу /cabinet/.
# Симулятор один раз заводит realm, оператора и активы, затем пишет измерения.

volumes:
  proxy-data:
  manager-data:
  postgresql-data:
  cabinet-dist:

services:
  proxy:
    image: openremote/proxy:${STACK_VERSION:-1.30.1}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Europe/Moscow
      DOMAINNAME: ${OR_HOSTNAME:-localhost}
      LE_EMAIL: ${OR_EMAIL_ADMIN:-}

  postgresql:
    image: openremote/postgresql:${STACK_VERSION:-1.30.1}
    restart: always
    shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
      POSTGRES_DB: openremote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  keycloak:
    image: openremote/keycloak:${STACK_VERSION:-1.30.1}
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      KC_HOSTNAME: https://${OR_HOSTNAME:-localhost}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL_HOST: postgresql
      KC_DB_URL_DATABASE: openremote
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres

  cabinet:
    build:
      context: .
      dockerfile: ui/cabinet/Dockerfile
    volumes:
      - cabinet-dist:/out

  manager:
    image: openremote/manager:${STACK_VERSION:-1.30.1}
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
      cabinet:
        condition: service_completed_successfully
    volumes:
      - manager-data:/storage
      - ./deployment:/deployment
      - cabinet-dist:/deployment/manager/app/cabinet
    environment:
      TZ: Europe/Moscow
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      OR_HOSTNAME: ${OR_HOSTNAME:-localhost}
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_SETUP_RUN_ON_RESTART: "false"
      OR_ROOT_REDIRECT_PATH: /cabinet
      OR_CUSTOM_APP_DOCROOT: /deployment/manager/app
      OR_DB_HOST: postgresql
      OR_DB_NAME: openremote
      OR_DB_USER: postgres
      OR_DB_PASSWORD: postgres
      OR_KEYCLOAK_HOST: keycloak
      OR_KEYCLOAK_PORT: "8080"
      OR_KEYCLOAK_PATH: auth
      OR_WEBSERVER_ALLOWED_ORIGINS: http://localhost:9000

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      MANAGER_URL: http://manager:8080
      KEYCLOAK_URL: http://keycloak:8080/auth
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      OPERATOR_USER: ${OPERATOR_USER:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator}
      CABINET_REALM: ${CABINET_REALM:-boiler}
      PLANT_NAME: ${PLANT_NAME:-Котельная, дом 12}
      REDIRECT_URIS: http://localhost:9000/*,http://localhost/*,https://localhost/*,http://127.0.0.1:9000/*
      SIM_INTERVAL_MS: "5000"
      SIM_STEP_MINUTES: "1"
